[platformio]
default_envs = detector

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:detector]
build_flags = ${env.build_flags} -D REQUIRE_TRAINED_MODEL=1

[env:diagnostic]
; Compila pipeline completo sem modelo; alertas permanecem desabilitados.
build_flags = ${env.build_flags}

[env:mic_test]
build_flags = ${env.build_flags} -D MIC_TEST=1

[env:recorder]
build_flags = ${env.build_flags} -D CAPTURE_ONLY=1
monitor_speed = 921600

[env:wokwi_demo]
build_flags = ${env.build_flags} -D SIMULATED_AUDIO=1 -D SIMULATOR_DEMO=1

[env:wokwi_audio]
build_flags = ${env.build_flags} -D SIMULATED_AUDIO=1 -D SIMULATOR_REAL=1

[env:wokwi_mic]
build_flags = ${env.build_flags} -D SERIAL_MIC=1 -D SIMULATOR_REAL=1
monitor_speed = 921600
